name: Fetch Latest Research Articles

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write # <-- This fixes the permission denied error

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create _data directory
        run: mkdir -p _data

      - name: Download Articles from Brain Regeneration API
        run: |
          curl -s "https://api.brain-regeneration.com/articles/?format=json&subject_id=17&published_date_after=2026-10-14&ordering=-ml_score%60" -o _data/articles.json

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Brain Regeneration research articles"
          file_pattern: "_data/articles.json"