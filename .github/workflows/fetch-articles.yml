name: Fetch Latest Research Articles

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create _data directory
        run: mkdir -p _data

      - name: Download Articles from Brain Regeneration API
        run: |
          curl -s "https://api.brain-regeneration.com/articles/?subject_id=17" -o _data/articles.json

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Brain Regeneration research articles"
          file_pattern: "_data/articles.json"